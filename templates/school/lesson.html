{% extends "base.html" %}

{% block body %}

<div class="dashboard-container">

    <section class="dashboard-section">
        <div class="section-header">
            <h2><i class="fa-solid fa-video"></i> {{ lesson.title }}</h2>
            <a href="{{ url_for('school.course', id=lesson.course_id) }}" class="btn">Back to Course</a>
        </div>

        <div class="profile-card">
            <div class="profile-info">
                <p>{{ lesson.description }}</p>
                <p>
                    <a href="{{ lesson.video_url }}" target="_blank" class="btn">
                        <i class="fa-solid fa-play"></i> Watch Video
                    </a>
                </p>
            </div>
        </div>
    </section>

</div>

{% endblock %}
