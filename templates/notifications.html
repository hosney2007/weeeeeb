{% extends "base.html" %}

{% block body %}

<div class="dashboard-container">

    <section class="dashboard-section">
        <div class="section-header">
            <h2><i class="fa-solid fa-bell"></i> Notifications</h2>
        </div>

        {% if notifications %}
        <div class="notification-list">
            {% for n in notifications %}
            <a href="{{ url_for('notifications.open_notification', id=n.id) }}" class="notification-item {% if not n.is_read %}unread{% endif %}">
                <div class="notification-item-icon">
                    <i class="fa-solid fa-bell"></i>
                </div>
                <div class="notification-item-body">
                    <p class="notification-item-title">{{ n.title }}</p>
                    <p class="notification-item-message">{{ n.message }}</p>
                    <span class="notification-item-time">{{ n.created_at.strftime("%Y-%m-%d %H:%M") }}</span>
                </div>
            </a>
            {% endfor %}
        </div>
        {% else %}
        <div class="empty-state"><p>No notifications yet.</p></div>
        {% endif %}
    </section>

</div>

{% endblock %}
