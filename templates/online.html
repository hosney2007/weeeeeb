{% extends "base.html"%}

{%block body%}


<section class="recorded-page">
    <div class="recorded-header">
       <h1 class="page-title">online Courses</h1>
       <p>Attend live zoom classes from anywhere and interact directly with the instructor</p>
    </div>
</section>
<section  class="recorded-courses">
    <div class="recorded-container">
        <div class="recorded-grid">
          {%for course in course%}
          <div  data-aos="zoom-in" data-aos-delay="300">
            <div class="recorded-card">
                <div class="recorded-img">
                    {%if course.image%}
                      <img src="{{ url_for('static', filename='uploads/'+ course.image) }}" alt="{{course.title}}">
                    {%endif%}
                </div>
                <div class="recorded-content" >
                    <h3>{{course.title}}</h3>
                    <p> {{course.description}}</p>
                    <a href="/booking" class="btn btn-admin"> Book course</a>
                </div>
                <div class="recorded-actions">

                </div>
            </div>
          </div> 
          {%endfor%} 
        </div>
    </div>
</section>   
{%endblock%}
