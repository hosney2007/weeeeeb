{% extends "base.html"%}
{%block body%}

<div class="admin-container">
    <div class="card-admin">
        <div class="card-header">
            <h2 class="card-title">edite lesson</h2>
        </div>
        <div class="booking-form">
            <form method="post" class="admin-form">
                <input type="hidden" name="csrf_token" value="{{csrf_token()}}">

               <div class="input-box">
                   <label class="form-label">lesson Name</label>
                   <input
                    type="text"
                    name="title"
                    value="{{lesson.title}}"
                     required
                    > 
               </div>
               <div class="input-box">
                   <label class="form-label">video-link</label>
                  <input 
                   name="video_links"
                   value="{{lesson.video_links}}"
                   required
                  > 
               </div>
               <div class="input-box">
                   <label class="form-label">lesson order</label>
                   <input
                    type="number"
                    name="lesson_order"
                    value="{{lesson.lesson_order}}"
                     required
                    > 
               </div>
               <div class="submit-btn">
                 <button type="submit">
                 save edits
                </button>
               </div>
            </form>
        </div>
    </div>
</div>
{%endblock%}
