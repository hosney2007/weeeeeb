{% extends "base.html"%}

{%block body%}

<div class="admin-container">
    <div class="card-admin">
        <div class="card-header">
            <h2 class="card-title">Courses</h2>
            <a href="/admin/add-course" class="btn-admin outline-btn">
                <i class="fa-solid fa-plus"></i>
                Add course
            </a>
        </div>
        <div class="course-grid">
            {% for course in course%}
            <div class="course-card">
           <div class="course-card-header">
              <i class="fa-solid fa-book"></i>
              <h3>{{course.title}}</h3>
           </div>
           <p>{{course.description}}</p>
           <div class="course-actions">
            <a href="{{ url_for('admin.edit_course', course_id=course.id)}}"class="action-btn edit-btn">
                <i class="fa-solid fa-pen"></i>
            </a>
            <form method="post" action="{{ url_for('admin.delete_course', course_id=course.id)}}" style="display:inline;" onsubmit="return confirm('Delete this course?');">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="action-btn delete-btn">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </form>
           </div>
       </div>
     {%endfor%}
</div>
         
{%endblock%}
