{% extends "base.html" %}

{% block body %}

<div class="admin-container">
    <div class="card-admin">
        <div class="card-header">
            <h2 class="card-title">Lessons - {{ recorded.title }}</h2>
            <a href="{{ url_for('recorded.recorded_courses') }}" class="btn-admin outline-btn">
                <i class="fa-solid fa-arrow-left"></i> Back to Courses
            </a>
        </div>

        <div class="booking-form">
            <form method="post" class="admin-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="input-box">
                    <label class="form-label">Lesson Title</label>
                    <input type="text" name="title" placeholder="Lesson title" required>
                </div>

                <div class="input-box">
                    <label class="form-label">Video Link</label>
                    <input type="text" name="video_links" placeholder="https://..." required>
                </div>

                <div class="input-box">
                    <label class="form-label">Order</label>
                    <input type="number" name="lesson_order" value="{{ lesson|length + 1 }}">
                </div>

                <div class="submit-btn">
                    <button type="submit">Add Lesson</button>
                </div>
            </form>
        </div>

        <div class="card-body">
            <div class="table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Order</th>
                            <th>Title</th>
                            <th>Video</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for item in lesson %}
                        <tr>
                            <td>{{ item.lesson_order }}</td>
                            <td>{{ item.title }}</td>
                            <td><a href="{{ item.video_links }}" target="_blank">link</a></td>
                            <td>
                                <div class="table-action">
                                    <a href="{{ url_for('recorded.edit_lesson', id=item.id) }}" class="btn btn-sm">
                                        <i class="fa-solid fa-pen"></i> Edit
                                    </a>
                                    <form method="post" action="{{ url_for('recorded.delete_lesson', id=item.id) }}" style="display:inline;" onsubmit="return confirm('Delete this lesson?');">
                                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                                        <button type="submit" class="btn btn-danger btn-sm">
                                            <i class="fa-solid fa-trash"></i> Delete
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        {% else %}
                        <tr><td colspan="4" class="table-empty">No lessons yet.</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

{% endblock %}
