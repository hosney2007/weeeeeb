{% extends "base.html" %}

{% block body %}

<div class="admin-container py-4">

    <h2 class="mb-4">

        Add Success Story

    </h2>

    <form method="POST"
          enctype="multipart/form-data">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <div class="mb-3">

            <label>

                Student Name

            </label>

            <input
                type="text"
                class="form-control"
                name="student_name"
                required
            >

        </div>

        <div class="mb-3">

            <label>

                Subject

            </label>

            <input
                type="text"
                class="form-control"
                name="subject"
                required
            >

        </div>

        <div class="row">

            <div class="col">

                <label>

                    Before Score

                </label>

                <input
                    type="number"
                    class="form-control"
                    name="before_score"
                    required
                >

            </div>

            <div class="col">

                <label>

                    After Score

                </label>

                <input
                    type="number"
                    class="form-control"
                    name="after_score"
                    required
                >

            </div>

        </div>

        <div class="mt-3">

            <label>

                Student Review

            </label>

            <textarea
                class="form-control"
                rows="5"
                name="review"
                required
            ></textarea>

        </div>

        <div class="mt-3">

            <label>

                Student Photo

            </label>

            <input
                type="file"
                class="form-control"
                name="image"
                accept=".jpg,.jpeg,.png,.webp"
                required
            >

        </div>

        <button
            class="btn btn-success mt-4">

            Add Story

        </button>

    </form>

</div>

{% endblock %}
