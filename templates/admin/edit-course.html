{% extends "base.html"%}
{%block body%}

<div class="admin-container">
    <div class="card-admin">
        <div class="card-header">
            <h2 class="card-title">edite course</h2>
        </div>
        <div class="booking-form">
            <form method="post" class="admin-form">
                 <input type="hidden" name="csrf_token" value="{{csrf_token()}}">

               <div class="input-box">
                   <label class="form-label">Course Name</label>
                   <input
                    type="text"
                    name="title"
                    value="{{course.title}}"
                     required
                    > 
               </div>
               <div class="input-box">
                   <label class="form-label">Course description</label>
                  <textarea 
                   name="description"
                   required
                  > {{course.description}}</textarea>
               </div>
               <div class="input-box">

                <select name="course_type" id="course_type" required>
                  <option value="">
                     choose course
                  </option>
                  <option value="offline" {% if course.course_type == "offline" %} selected {% endif %}>
                     offline
                   </option>
                   <option value="online" {% if course.course_type =="online" %} selected {% endif %}>
                      online
                   </option>
                </select>


               </div>
               <div class="submit-btn">
                 <button type="submit">
                 save edits
                </button>
               </div>
            </form>
        </div>
    </div>
</div>
{%endblock%}
