{% extends "base.html" %}

{% block body %}

<div class="admin-container">
    <div class="card-admin">
        <div class="card-header">
            <h2 class="card-title">School Portal - Courses</h2>
        </div>

        {% include "admin/school/nav.html" %}

        <div class="booking-form">
            <form method="post" class="admin-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="input-box">
                    <label class="form-label">Course Name</label>
                    <input type="text" name="name" placeholder="Course name" required>
                </div>

                <div class="input-box">
                    <label class="form-label">Description</label>
                    <textarea name="description" placeholder="Course description"></textarea>
                </div>

                <div class="input-box">
                    <label class="form-label">Grade</label>
                    <select name="grade_id" required>
                        <option value="">choose grade</option>
                        {% for grade in grades %}
                        <option value="{{ grade.id }}">{{ grade.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="submit-btn">
                    <button type="submit">Add Course</button>
                </div>
            </form>
        </div>

        <div class="course-grid">
            {% for course in courses %}
            <div class="course-card">
                <div class="course-card-header">
                    <i class="fa-solid fa-book"></i>
                    <h3>{{ course.name }}</h3>
                </div>
                <p>{{ course.description }}</p>
                <p><strong>Grade:</strong> {{ course.grade.name }}</p>
                <div class="course-actions">
                    <a href="{{ url_for('school_admin.lessons', id=course.id) }}" class="btn">
                        <i class="fa-solid fa-video"></i> Lessons
                    </a>
                    <a href="{{ url_for('school_admin.sheets', id=course.id) }}" class="btn">
                        <i class="fa-solid fa-file"></i> Sheets
                    </a>
                    <a href="{{ url_for('school_admin.assignments', id=course.id) }}" class="btn">
                        <i class="fa-solid fa-file-pen"></i> Assignments
                    </a>
                    <form method="post" action="{{ url_for('school_admin.delete_course', id=course.id) }}" style="display:inline;">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button type="submit" class="action-btn delete-btn">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </form>
                </div>
            </div>
            {% else %}
            <div class="empty-state"><p>No courses yet.</p></div>
            {% endfor %}
        </div>

    </div>
</div>

{% endblock %}
