{% extends "base.html" %}

{% block body %}

<div class="admin-container">
    <div class="card-admin">
        <div class="card-header">
            <h2 class="card-title">Lessons - {{ course.name }}</h2>
            <a href="{{ url_for('school_admin.courses') }}" class="btn-admin outline-btn">
                <i class="fa-solid fa-arrow-left"></i> Back to Courses
            </a>
        </div>

        <div class="booking-form">
            <form method="post" class="admin-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="input-box">
                    <label class="form-label">Lesson Title</label>
                    <input type="text" name="title" placeholder="Lesson title" required>
                </div>

                <div class="input-box">
                    <label class="form-label">Description</label>
                    <textarea name="description" placeholder="Lesson description"></textarea>
                </div>

                <div class="input-box">
                    <label class="form-label">Video URL</label>
                    <input type="text" name="video_url" placeholder="https://..." required>
                </div>

                <div class="input-box">
                    <label class="form-label">Order</label>
                    <input type="number" name="order" value="{{ course.lessons|length + 1 }}">
                </div>

                <div class="submit-btn">
                    <button type="submit">Add Lesson</button>
                </div>
            </form>
        </div>

        <div class="card-body">
            <div class="table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Order</th>
                            <th>Title</th>
                            <th>Video</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for lesson in course.lessons %}
                        <tr>
                            <td>{{ lesson.order }}</td>
                            <td>{{ lesson.title }}</td>
                            <td><a href="{{ lesson.video_url }}" target="_blank">link</a></td>
                            <td>
                                <div class="table-action">
                                    <form method="post" action="{{ url_for('school_admin.delete_lesson', id=lesson.id) }}" style="display:inline;">
                                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                                        <button type="submit" class="btn btn-danger btn-sm">
                                            <i class="fa-solid fa-trash"></i> Delete
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        {% else %}
                        <tr><td colspan="4" class="table-empty">No lessons yet.</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

{% endblock %}
