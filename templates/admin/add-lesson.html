{% extends "base.html"%}
{%block body%}



<div class="admin-container">
    <div class="card-admin">
        <div class="card-header">
            <h2 class="card-title">lesson</h2>
        </div>
        <div class="booking-form">
            <form method="post" class="admin-form">
                <input type="hidden" name="csrf_token" value="{{csrf_token()}}">

               <div class="input-box">
                   <label class="form-label">Lesson Name</label>
                   <input
                    type="text"
                    name="title"
                    placeholder="Lesson Title"
                    required
                    > 
               </div>
               <div class="input-box">
                   <label class="form-label">video</label>
                    <input 
                     name="video_links"
                    placeholder="video Link"
                    required
                    >
               </div>
               <div class="input-box">
                   <label class="form-label">lesson order</label>
                   <input
                    type="number"
                    name="lesson_order"
                    required
                   >
               </div>
               <div class="submit-btn">
                 <button type="submit">
                 add lesson 
                </button>
               </div>
            </form>
        </div>
    </div>
</div>       

{%endblock%}
